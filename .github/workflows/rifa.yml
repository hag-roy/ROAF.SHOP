name: Motor de Sorteo RO Store

on:
  schedule:
    - cron: '0 20,21,22,23,0 * * *'
  workflow_dispatch:

jobs:
  ejecutar_sorteo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ejecutar el script de eliminación
        run: python sorteo.py

      - name: Guardar cambios (Commit y Push)
        run: |
          git config --global user.name 'GitHub Action Sorteo'
          git config --global user.email 'action@github.com'
          git add boletos.json
          git commit -m "Automatización: Participante eliminado" || echo "No hay cambios"
          git push
