<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gran Sorteo - ROAF SHOP</title>
    <!-- Fuentes de Google para un toque premium -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --bg-dark: #0a0a12;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            padding: 40px 20px;
            /* Fondo con gradiente radial y patrón sutil */
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a3a 0%, var(--bg-dark) 70%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            margin-bottom: 40px;
            animation: pulse-glow 2s infinite alternate;
        }

        /* Efecto Cristal (Glassmorphism) */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 35px;
            margin: 25px 0;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 15px 40px 0 rgba(0, 240, 255, 0.1);
        }

        h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-blue);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Buscador */
        .search-box {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        input[type="text"] {
            padding: 15px 25px;
            width: 65%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--neon-blue);
            color: white;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        button {
            padding: 15px 35px;
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        button:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            transform: scale(1.05);
        }

        /* Ruleta Épica */
        .ruleta-container {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.3);
        }

        #ruleta-texto {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.1s ease-out;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .animando { color: #fff; filter: blur(2px); transform: scale(1.05); }
        .target-eliminado { color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink); transform: scale(1.1); }
        .target-ganador { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green), 0 0 50px var(--neon-green); font-size: 3.5rem !important; transform: scale(1.15); animation: pulse-win 1s infinite alternate; }

        /* Eliminados Grid */
        .eliminados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .eliminado-card {
            background: rgba(255, 0, 127, 0.05);
            border: 1px solid rgba(255, 0, 127, 0.3);
            padding: 20px;
            border-radius: 12px;
            color: #ff99cc;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .eliminado-card:hover {
            background: rgba(255, 0, 127, 0.1);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .eliminado-card strong { font-size: 1.2rem; margin-bottom: 5px; color: #fff; }
        .eliminado-card span.hora { font-size: 0.85em; color: #a0a0a0; margin-top: 8px; font-family: monospace; }
        
        #mensaje-estado { font-size: 1.3rem; color: #a0a0a0; margin-bottom: 15px; font-weight: 300; }

        /* CRÉDITOS DEL CREADOR */
        .creditos-footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
            font-size: 1rem;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .creditos-footer span {
            color: var(--neon-blue);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        /* Animaciones */
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); }
            100% { text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue), 0 0 60px var(--neon-blue); }
        }

        @keyframes pulse-win {
            0% { text-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--neon-green); }
            100% { text-shadow: 0 0 40px var(--neon-green), 0 0 80px var(--neon-green), 0 0 120px var(--neon-green); }
        }

        /* Responsivo para celulares */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .search-box { flex-direction: column; }
            input[type="text"], button { width: 100%; }
            #ruleta-texto { font-size: 2rem; }
            .panel { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎟️ ROAF SORTEOS</h1>
        
        <!-- Buscador -->
        <div class="panel">
            <h3>🔍 Verifica tu suerte</h3>
            <div class="search-box">
                <input type="text" id="telefono-input" placeholder="Ingresa tu número (Ej. 7771234567)">
                <button onclick="buscarBoletos()">Verificar</button>
            </div>
            <div id="resultado-busqueda" style="margin-top: 20px; font-weight: 500; font-size: 1.1rem; color: var(--neon-blue);"></div>
        </div>

        <!-- Ruleta -->
        <div class="panel">
            <div id="mensaje-estado">Sincronizando con el servidor central...</div>
            <div class="ruleta-container">
                <div id="ruleta-texto">ESPERANDO...</div>
            </div>
        </div>

        <!-- Eliminados -->
        <div class="panel" style="border-color: rgba(255,0,127,0.3);">
            <h3 style="color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,0,127,0.5);">💀 Zona de Eliminados</h3>
            <div class="eliminados-grid" id="lista-eliminados"></div>
        </div>

        <!-- AQUÍ ESTÁ TU FIRMA COMO CREADOR -->
        <div class="creditos-footer">
            Sistema desarrollado y diseñado por <span>TU NOMBRE / ROAF SHOP</span> © 2026
        </div>
    </div>
