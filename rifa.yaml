name: Motor de Sorteo RO Store

on:
  schedule:
    # Ejecutar en el minuto 0 de las horas 20, 21, 22, 23 y 00 (UTC)
    # Equivale a las 14:00, 15:00, 16:00, 17:00 y 18:00 hrs locales
    - cron: '0 20,21,22,23,0 * * *'
  workflow_dispatch: # Botón para probarlo manualmente desde GitHub

jobs:
  ejecutar_sorteo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para sobreescribir boletos.json

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Ejecutar el script de eliminación
        run: python sorteo.py

      - name: Guardar cambios (Commit y Push)
        run: |
          git config --global user.name 'GitHub Action Sorteo'
          git config --global user.email 'action@github.com'
          git add boletos.json
          git commit -m "Automatización: Participante eliminado" || echo "No hay cambios"
          git push